# Destructive actions. Hot-reloaded on save; also editable by voice ("add terraform apply to destructive").
#
# Anything matching here can never be auto-approved or "always allowed".
# To approve, you must SAY the confirm phrase: "confirm <verb>" (e.g. "confirm push").
#
#   pattern: case-insensitive regex, tested against the command text
#            (Bash: each part of the whole command that could change something, between &&, ;, | and line breaks,
#            with paths, file names and quoted text left out unless the part runs text as code: sh, ssh, psql,
#            python, ...; read-only parts such as "ls deploy/" or "grep -rn push" are never tested;
#            other tools: "<Tool> <file path or input>")
#   verb:    the word you have to say after "confirm"
#   tools:   optional, which tools the rule applies to (default: Bash); workers' tools or the operator's own
#   scope:   optional; protectedBranch: a worker's command needs the phrase only when its git calls run on a protected
#            branch (permissions.protectedBranches in config.yaml, or the branch of the repo's main checkout), or
#            when it can't tell which branch (an unclear cd, a branch switch, a detached HEAD). On any other branch
#            of a linked worktree it runs like any other command. The operator's own commands always need the phrase.

rules:
  - { pattern: '\bgit\s+push\b',                 verb: push }
  - { pattern: '\bgit\s+commit\b',               verb: commit, scope: protectedBranch }
  - { pattern: '\bgit\s+merge\b',                verb: merge, scope: protectedBranch }
  - { pattern: '\bgit\s+reset\s+--hard\b',       verb: reset }
  - { pattern: '\bgit\s+clean\b',                verb: clean }
  - { pattern: '\bgit\s+branch\s+-D\b',          verb: delete }
  - { pattern: '\bgit\s+(checkout|restore)\s+(--\s+)?\.(\s|$)', verb: discard }
  - { pattern: '\bgit\s+rebase\b',               verb: rebase }
  - { pattern: '\bgit\s+stash\s+(drop|clear)\b', verb: drop }
  - { pattern: '\brm\s+(-\w*[rf]\w*\s+)',        verb: delete }
  - { pattern: '\b(drop|truncate)\s+(table|database|schema)\b', verb: drop }
  - { pattern: '\bnpm\s+publish\b',              verb: publish }
  - { pattern: '\bdocker\s+(system\s+prune|volume\s+rm|rm)\b', verb: prune }
  - { pattern: '\bkubectl\s+(delete|apply)\b',   verb: apply }
  - { pattern: '\bterraform\s+(apply|destroy)\b', verb: apply }
  - { pattern: '\b(migrate|migration)\b.*\b(prod|production)\b', verb: migrate }
  - { pattern: '\bdeploy\b',                     verb: deploy }
  - { pattern: '^mcp__claude_ai_Google_Calendar__delete_event\b', verb: delete, tools: [mcp__claude_ai_Google_Calendar__delete_event] }
  - { pattern: '^mcp__claude_ai_Google_Calendar__update_event\b', verb: update, tools: [mcp__claude_ai_Google_Calendar__update_event] }
